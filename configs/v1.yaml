experiment:
  name: v1_etth1_ms
  seed: 2026
  device: auto
  output_root: .
  deterministic: true

data:
  path: datasets/raw/ETTh1.csv
  date_col: date
  feature_cols: [HUFL, HULL, MUFL, MULL, LUFL, LULL, OT]
  target_cols: [HUFL, HULL, MUFL, MULL, LUFL, LULL, OT]
  features: M
  seq_len: 96
  pred_len: 96
  stride: 1
  batch_size: 32
  num_workers: 0
  pin_memory: false
  split:
    type: ratio
    train: 0.7
    val: 0.1
    test: 0.2

model:
  name: v1
  d_model: 256
  n_heads: 4
  n_layers: 2
  d_ff: 1024
  dropout: 0.1
  activation: gelu
  positional_encoding: learned

patch:
  length: 16
  stride: 8

mask:
  random_ratio: 0.4
  tail_ratio: 0.25
  random_probability: 0.5

pretrain:
  checkpoint: checkpoints/v1_etth1_ms_seed2026_20261019-232701-422387_977d5a/best.pt
  epochs: 50
  val_ratio: 0.1
  early_stopping_patience: 3
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4

adaptation:
  mode: qkv
  rank: 8
  alpha: 16
  dropout: 0.0

interval:
  quantiles: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  epsilon: 1.0e-6

loss:
  interval_weight: 0.0

optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4

scheduler:
  name: none

training:
  epochs: 50
  early_stopping_patience: 3
  monitor: val_loss
  monitor_mode: min
  grad_clip_norm: 1.0
  resume_from: null

evaluation:
  coverage_levels: [0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90]
  primary_coverage: 0.90
  save_predictions: true

logging:
  level: INFO

visualization:
  enabled: true
  formats: [png, pdf]
  dpi: 300
  max_points: 300
  sample_index: 0
  channel_index: 0
